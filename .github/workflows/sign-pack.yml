# Sign an agent pack with the store release key and commit the resulting pack.sig.
#
# MANUAL DISPATCH ONLY — READ BEFORE CHANGING THE TRIGGER
# -------------------------------------------------------
# It is tempting to run this on every push to agent-packs/**. Do not. A signature that is
# automatically regenerated whenever the content changes attests nothing: it would have happily
# re-signed commit 67acb69 (the edit that silently broke joker1's signature) and every future
# edit, including a malicious one. The signature would then track HEAD, which git already does,
# and the "refuse to load a modified pack" guarantee on every consumer would be worth zero.
#
# A human naming the pack and pressing Run is the point: it is the moment someone asserts
# "this content is a release". Verify Pack Signatures then keeps that assertion honest on
# every subsequent push.
#
# The private half is PACK_SIGNING_PRIVATE_PEM, scoped to the `release` ENVIRONMENT (see the
# job below), not to the repository. Repo-wide it would be readable by any workflow anyone
# could land — and in a PUBLIC repo a secret is exfiltratable by whoever can merge a workflow
# change, because log masking is defeated by base64/splitting.
#
# Even scoped, understand what this does and does not defend. It defends the DISTRIBUTION
# path: a pack modified on a mirror, a CDN, a deploy host, or a checked-out directory still
# fails verification. It does NOT defend against a malicious maintainer — a repo admin can
# edit the environment. The real boundary is a KMS/OIDC signer where no private key exists as
# a file at all; this is the cheap step available today.
name: Sign Pack

on:
  workflow_dispatch:
    inputs:
      pack:
        description: "Pack directory name under agent-packs/ (e.g. joker1)"
        required: true
        type: string

permissions:
  contents: write
  packages: read

jobs:
  sign:
    runs-on: ubuntu-latest
    # PACK_SIGNING_PRIVATE_PEM is scoped to this environment, NOT to the repository. That is
    # what makes signing a reviewed act instead of a side effect of push access: the job pauses
    # here until a required reviewer approves, and the approval is recorded against the run.
    # Repo-wide, the secret was readable by any workflow anyone could land — and a secret in a
    # PUBLIC repo's Actions is exfiltratable by whoever can merge a workflow change, since log
    # masking is defeated by base64/splitting. Scoping it does not stop a repo admin from
    # editing the environment, so this is a higher bar, not a true trust boundary; the real
    # boundary is a KMS/OIDC signer where no private key exists as a file at all.
    environment: release
    env:
      RUNTIME_IMAGE: ghcr.io/agenthippoai/runtime:1.110.9
      PACK: ${{ inputs.pack }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate input
        run: |
          set -euo pipefail
          # The value is interpolated into paths and a docker -v argument; constrain it rather
          # than trusting a dispatch input.
          case "$PACK" in
            *[!A-Za-z0-9._-]* | "" | .* )
              echo "::error::invalid pack name: '${PACK}' (letters, digits, dot, underscore, hyphen; no leading dot)"; exit 1 ;;
          esac
          [ -d "agent-packs/${PACK}" ] || { echo "::error::agent-packs/${PACK} does not exist"; exit 1; }

      - name: Log in to GHCR
        # See verify-packs.yml: the runtime package must grant this repo read access, or a
        # GHCR_PULL_TOKEN secret (read:packages) must be set.
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${GHCR_PULL_TOKEN}" ]; then
            echo "${GHCR_PULL_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          else
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi

      - name: Decide whether signing is actually needed
        id: need
        env:
          PACK_SIGNING_KID: ${{ vars.PACK_SIGNING_KID }}
        run: |
          set -euo pipefail
          # `pack sign` stamps an `iat` into the JWT, so re-signing byte-identical content
          # still produces a different pack.sig. A `git diff --quiet` guard therefore never
          # fires, and every dispatch lands a churn commit that changes nothing anyone can
          # verify differently. Compare what the signature ASSERTS instead: the content digest
          # and the kid.
          #
          # kid is part of the comparison on purpose — re-signing unchanged content under a NEW
          # key is exactly what key rotation is, and must not be skipped.
          current="$(docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/agent-packs/${PACK}:/pack:ro" "$RUNTIME_IMAGE" pack digest /pack \
            | awk '{print $1}')"
          echo "current digest: ${current}"
          if [ -f "agent-packs/${PACK}/pack.sig" ]; then
            read -r sig_digest sig_kid < <(python3 - "agent-packs/${PACK}/pack.sig" <<'PY'
          import base64, json, sys
          h, p, _ = open(sys.argv[1]).read().strip().split(".")
          d = lambda s: json.loads(base64.urlsafe_b64decode(s + "=" * (-len(s) % 4)))
          print(d(p).get("digest", ""), d(h).get("kid", ""))
          PY
          )
            echo "signed digest : ${sig_digest} (kid ${sig_kid})"
            if [ "$sig_digest" = "$current" ] && [ "$sig_kid" = "$PACK_SIGNING_KID" ]; then
              echo "Already signed for this exact content under ${PACK_SIGNING_KID}. Nothing to do."
              echo "needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "no existing pack.sig"
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Sign
        if: steps.need.outputs.needed == 'true'
        env:
          PACK_SIGNING_PRIVATE_PEM: ${{ secrets.PACK_SIGNING_PRIVATE_PEM }}
          PACK_SIGNING_KID: ${{ vars.PACK_SIGNING_KID }}
        run: |
          set -euo pipefail
          if [ -z "${PACK_SIGNING_PRIVATE_PEM}" ] || [ -z "${PACK_SIGNING_KID}" ]; then
            echo "::error::PACK_SIGNING_PRIVATE_PEM secret / PACK_SIGNING_KID variable not configured."
            exit 1
          fi
          KEY="${RUNNER_TEMP}/pack-signing.pem"
          ( umask 077; printf '%s\n' "$PACK_SIGNING_PRIVATE_PEM" > "$KEY" )
          docker pull -q "$RUNTIME_IMAGE"
          echo "digest before signing:"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/agent-packs/${PACK}:/pack:ro" "$RUNTIME_IMAGE" pack digest /pack
          # --user: the image runs as uid 10001 (agent), but $KEY is 0600 owned by the runner.
          # Without this the container cannot read its own key file -> EACCES. This is invisible
          # on macOS, where Docker Desktop maps uids; it fails on every Linux host.
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/agent-packs/${PACK}:/pack" \
            -v "$KEY:/key.pem:ro" \
            "$RUNTIME_IMAGE" pack sign /pack --key /key.pem --kid "$PACK_SIGNING_KID"
          rm -f "$KEY"

      - name: Verify what we just produced
        if: steps.need.outputs.needed == 'true'
        env:
          PACK_SIGNING_KID: ${{ vars.PACK_SIGNING_KID }}
          PACK_SIGNING_PUBLIC_PEM: ${{ vars.PACK_SIGNING_PUBLIC_PEM }}
        run: |
          set -euo pipefail
          # Never commit a signature we have not checked with the public half that consumers
          # will actually use — that is the only thing proving the published key matches.
          python3 - <<'PY' > "${RUNNER_TEMP}/keys.json"
          import json, os
          print(json.dumps({os.environ["PACK_SIGNING_KID"]: os.environ["PACK_SIGNING_PUBLIC_PEM"]}))
          PY
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/agent-packs/${PACK}:/pack:ro" \
            -v "${RUNNER_TEMP}/keys.json:/keys.json:ro" \
            "$RUNTIME_IMAGE" pack verify /pack --keys /keys.json

      - name: Commit pack.sig
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "agent-packs/${PACK}/pack.sig"
          git commit -m "${PACK}: re-sign with ${{ vars.PACK_SIGNING_KID }}

          Signed by the Sign Pack workflow, dispatched by @${{ github.actor }}.
          Verified against the published public half before commit."
          git push
