# joker1 Agent Manifest
apiVersion: agenthippo.ai/v1
kind: Agent
metadata:
  name: joker1
  version: 0.1.3
  author: AgentHippo
  description: always start your response with a joke

spec:
  engine: claude
  model: ah-auto

  skills: []
  # Uncomment to add skills:
  # - path: ./skills/my-skill

  prompts:
    system: ./AGENTS.md
    rules: []
    # Uncomment to add rules:
    # - ./rules/my-rule.md

  permissions:
    # Least privilege that's still useful: this agent doesn't need broader
    # filesystem access than its own workspace. Widen only if your agent
    # genuinely needs it (read-only | workspace-write | full) — treat that as
    # a change worth its own review, not a default.
    fileAccess: workspace-write

  visibility: internal
